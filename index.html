<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    rel="shortcut icon"
    href="https://www.kantetsu.co.jp/cms/wp-content/themes/kr/img/favicon/favicon.ico"
  >

  <title>多客時放送システム　ver1.1</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #fff;

      background:
        radial-gradient(circle at top left, #3b2b75, transparent 35%),
        radial-gradient(circle at bottom right, #163b67, transparent 35%),
        #0d1117;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 30px;
    }

    .container {
      width: min(900px, 100%);
    }

    /* ------------------------------
       ヘッダー
    ------------------------------ */

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .header p {
      margin: 0;
      color: #9ca3af;
    }

    /* ------------------------------
       サウンドボード
    ------------------------------ */

    .sound-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .sound-button {
      position: relative;

      min-height: 150px;

      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;

      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);

      color: white;
      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;

      overflow: hidden;

      /* iPad/Safari対策 */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .sound-button:hover {
      transform: translateY(-4px);

      background: rgba(255,255,255,0.13);

      box-shadow:
        0 12px 30px rgba(0,0,0,0.3);
    }

    .sound-button:active {
      transform: scale(0.96);
    }

    /* 再生中 */

    .sound-button.playing {
      background:
        linear-gradient(
          135deg,
          rgba(99,102,241,0.55),
          rgba(168,85,247,0.45)
        );

      box-shadow:
        0 0 0 2px rgba(129,140,248,0.6),
        0 0 35px rgba(99,102,241,0.4);
    }

    .sound-button.playing::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 4px;

      background: #818cf8;

      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 0.4;
      }

      to {
        opacity: 1;
      }
    }

    .label {
      display: block;

      font-size: 30px;
      font-weight: 600;
    }

    /* ------------------------------
       設定パネル
    ------------------------------ */

    .control-panel {
      margin-top: 28px;

      padding: 24px;

      border-radius: 20px;

      border: 1px solid rgba(255,255,255,0.1);

      background: rgba(255,255,255,0.06);

      backdrop-filter: blur(12px);
    }

    .control-title {
      display: flex;

      justify-content: space-between;
      align-items: center;

      margin-bottom: 16px;
    }

    .control-title strong {
      font-size: 16px;
    }

    #delayValue {
      color: #a5b4fc;
      font-weight: 700;
      font-size: 18px;
    }

    /* ------------------------------
       スライダー
    ------------------------------ */

    #delaySlider {
      width: 100%;

      appearance: none;
      -webkit-appearance: none;

      height: 6px;

      border-radius: 10px;

      background: #374151;

      outline: none;

      cursor: pointer;
    }

    #delaySlider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;

      width: 22px;
      height: 22px;

      border-radius: 50%;

      background: #818cf8;

      border: 3px solid #fff;

      box-shadow:
        0 0 15px rgba(129,140,248,0.6);

      cursor: pointer;
    }

    #delaySlider::-moz-range-thumb {
      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #818cf8;

      border: 3px solid #fff;

      cursor: pointer;
    }

    .slider-labels {
      display: flex;

      justify-content: space-between;

      margin-top: 8px;

      color: #6b7280;

      font-size: 12px;
    }

    /* ------------------------------
       ステータス
    ------------------------------ */

    .status {
      margin-top: 18px;

      text-align: center;

      color: #9ca3af;

      font-size: 14px;
    }

    .status span {
      color: #a5b4fc;

      font-weight: 600;
    }

    /* ------------------------------
       スマホ対応
    ------------------------------ */

    @media (max-width: 700px) {

      .sound-board {
        grid-template-columns: repeat(2, 1fr);
      }

      .sound-button {
        min-height: 130px;
      }

      .header h1 {
        font-size: 26px;
      }
    }

    @media (max-width: 400px) {

      body {
        padding: 18px;
      }

      .sound-board {
        gap: 12px;
      }

      .sound-button {
        min-height: 120px;
        border-radius: 16px;
      }

      .control-panel {
        padding: 18px;
      }
    }

  </style>
</head>


<body>

  <main class="container">

    <!-- ヘッダー -->

    <header class="header">

      <h1>多客時放送システム</h1>

      <p>
        ボタンを押すと繰り返し再生します
      </p>

    </header>


    <!-- サウンドボード -->

    <section class="sound-board">

      <button
        type="button"
        class="sound-button"
        data-sound="audio/1.mp3">

        <span class="label">
          降車時
        </span>

      </button>


      <button
        type="button"
        class="sound-button"
        data-sound="audio/2.mp3">

        <span class="label">
          発車時
        </span>

      </button>


      <button
        type="button"
        class="sound-button"
        data-sound="audio/7.mp3">

        <span class="label">
          未実装
        </span>

      </button>


      <button
        type="button"
        class="sound-button"
        data-sound="audio/8.mp3">

        <span class="label">
          未実装
        </span>

      </button>


      <button
        type="button"
        class="sound-button"
        data-sound="audio/3.mp3">

        <span class="label">
          待機時
        </span>

      </button>


      <button
        type="button"
        class="sound-button"
        data-sound="audio/4.mp3">

        <span class="label">
          接近時
        </span>

      </button>


      <button
        type="button"
        class="sound-button"
        data-sound="audio/5.mp3">

        <span class="label">
          乗車時
        </span>

      </button>


      <button
        type="button"
        class="sound-button"
        data-sound="audio/6.mp3">

        <span class="label">
          閉扉時
        </span>

      </button>

    </section>


    <!-- 繰り返し間隔 -->

    <section class="control-panel">

      <div class="control-title">

        <strong>
          ⏱ 繰り返しまでの待ち時間
        </strong>

        <span id="delayValue">
          2秒
        </span>

      </div>


      <input
        type="range"
        id="delaySlider"
        min="0"
        max="30"
        step="1"
        value="2"
      >


      <div class="slider-labels">

        <span>0秒</span>
        <span>10秒</span>
        <span>20秒</span>
        <span>30秒</span>

      </div>

    </section>


    <!-- 状態表示 -->

    <div class="status">

      再生中：
      <span id="statusText">
        なし
      </span>

    </div>

  </main>


  <script>

    /* =========================================
       DOM
    ========================================= */

    const buttons =
  document.querySelectorAll(".sound-button");

const slider =
  document.getElementById("delaySlider");

const delayValue =
  document.getElementById("delayValue");

const statusText =
  document.getElementById("statusText");


/* =========================================
   Audioは1個だけ作成
========================================= */

const audio = new Audio();

audio.preload = "auto";
audio.volume = 1.0;


/* =========================================
   再生状態
========================================= */

let currentButton = null;
let currentSound = null;

let loopTimer = null;

/*
  再生セッション番号

  ボタンを切り替えるたびに増加させる。

  古い処理が後から実行されても、
  セッション番号が違えば無効として扱う。
*/
let playSession = 0;


/* =========================================
   スライダー
========================================= */

slider.addEventListener("input", () => {

  delayValue.textContent =
    slider.value + "秒";

});


/* =========================================
   タイマー停止
========================================= */

function clearLoopTimer() {

  if (loopTimer !== null) {

    clearTimeout(loopTimer);

    loopTimer = null;

  }

}


/* =========================================
   完全停止
========================================= */

function stopSound() {

  /*
    まずセッション番号を変更。

    これが重要。

    以前の非同期処理は、
    これによってすべて無効になる。
  */

  playSession++;


  /*
    タイマー停止
  */

  clearLoopTimer();


  /*
    Audio停止
  */

  audio.pause();


  /*
    再生位置を先頭へ
  */

  try {

    audio.currentTime = 0;

  } catch (error) {

    console.warn(
      "currentTime reset failed:",
      error
    );

  }


  /*
    ボタン表示解除
  */

  if (currentButton) {

    currentButton.classList.remove(
      "playing"
    );

  }


  currentButton = null;

  currentSound = null;

  statusText.textContent = "なし";

}


/* =========================================
   音声再生
========================================= */

async function playAudio(session) {

  /*
    すでに古いセッションなら終了
  */

  if (session !== playSession) {
    return;
  }


  /*
    ボタンがなくなっていたら終了
  */

  if (!currentButton) {
    return;
  }


  /*
    Audioが別の音声になっていた場合も終了
  */

  if (
    audio.src &&
    currentSound &&
    !audio.src.endsWith(currentSound)
  ) {
    return;
  }


  try {

    /*
      再生位置を先頭へ
    */

    audio.currentTime = 0;


    /*
      再生
    */

    await audio.play();


  } catch (error) {

    /*
      古いセッションなら何もしない
    */

    if (session !== playSession) {
      return;
    }


    console.warn(
      "音声再生エラー:",
      error
    );


    /*
      少し待って再試行
    */

    clearLoopTimer();


    loopTimer = setTimeout(() => {

      loopTimer = null;


      /*
        セッション確認

        ボタンが変更されていたら
        絶対に再生しない。
      */

      if (session !== playSession) {
        return;
      }


      if (!currentButton) {
        return;
      }


      playAudio(session);

    }, 1000);

  }

}


/* =========================================
   音声終了
========================================= */

audio.addEventListener("ended", () => {

  /*
    現在のセッションだけ処理する
  */

  const session =
    playSession;


  /*
    ボタンがなければ終了
  */

  if (!currentButton) {
    return;
  }


  /*
    タイマーをクリア
  */

  clearLoopTimer();


  /*
    待ち時間
  */

  const delay =
    Number(slider.value) * 1000;


  /*
    指定時間後に再生
  */

  loopTimer = setTimeout(() => {

    loopTimer = null;


    /*
      ボタンが切り替わっていたら
      ここで完全に終了
    */

    if (session !== playSession) {
      return;
    }


    if (!currentButton) {
      return;
    }


    /*
      再生
    */

    playAudio(session);

  }, delay);

});


/* =========================================
   ボタン
========================================= */

buttons.forEach((button) => {

  button.addEventListener("click", async () => {

    const soundFile =
      button.dataset.sound;


    /* -------------------------------------
       同じボタンなら停止
    ------------------------------------- */

    if (currentButton === button) {

      stopSound();

      return;

    }


    /* -------------------------------------
       まず現在の再生を完全停止
    ------------------------------------- */

    stopSound();


    /* -------------------------------------
       新しいセッション開始
    ------------------------------------- */

    const session =
      playSession;


    currentButton = button;

    currentSound = soundFile;


    /* -------------------------------------
       UI
    ------------------------------------- */

    button.classList.add("playing");


    statusText.textContent =
      button
        .querySelector(".label")
        .textContent
        .trim();


    /* -------------------------------------
       古い音声を完全停止
    ------------------------------------- */

    audio.pause();


    /*
      念のため再生位置をリセット
    */

    try {

      audio.currentTime = 0;

    } catch (error) {}


    /* -------------------------------------
       新しい音声をセット
    ------------------------------------- */

    audio.src = soundFile;

    audio.load();


    /* -------------------------------------
       重要

       このクリックから直接再生する。
       iPad Safariの自動再生制限対策。
    ------------------------------------- */

    await playAudio(session);

  });

});


/* =========================================
   Safari / iPad 復帰対策
========================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    /*
      画面が表示された場合だけ処理
    */

    if (
      document.visibilityState !== "visible"
    ) {
      return;
    }


    /*
      再生対象がなければ終了
    */

    if (!currentButton) {
      return;
    }


    /*
      Audioが停止していた場合
    */

    if (audio.paused) {

      /*
        新しいセッションとして再開
      */

      playSession++;

      const session =
        playSession;


      clearLoopTimer();


      loopTimer = setTimeout(() => {

        if (
          session === playSession &&
          currentButton
        ) {

          playAudio(session);

        }

      }, 300);

    }

  }
);


/* =========================================
   ページ終了時
========================================= */

window.addEventListener(
  "pagehide",
  () => {

    playSession++;

    clearLoopTimer();

    audio.pause();

  }
);


  </script>

</body>
</html>
